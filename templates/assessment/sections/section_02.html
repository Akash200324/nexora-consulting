{% load static %}

<section class="assessment-section-02 w-full bg-surface">
  <div class="flex flex-col w-full relative overflow-hidden">
    <!-- Subtle Background Word (REALITY) -->
    <div class="absolute -top-24 -left-12 pointer-events-none select-none opacity-[0.03] transform -rotate-2" style="writing-mode: vertical-rl;">
      <span class="font-display-lg text-display-lg text-on-surface text-[240px] leading-none whitespace-nowrap tracking-widest">
        REALITY
      </span>
    </div>
    <div class="w-full max-w-container-max mx-auto px-margin-mobile lg:px-margin-desktop py-section-gap relative z-10 flex flex-col lg:flex-row gap-16 lg:gap-32 items-center lg:items-start min-h-[716px]">
      <!-- Left Zone: Question Context -->
      <div class="w-full lg:w-5/12 flex flex-col gap-12 pt-8 relative">
        <!-- Decorative Abstract Shape (SVG) -->
        <div class="absolute -left-8 -top-8 w-32 h-32 opacity-10 pointer-events-none text-secondary">
          <svg fill="currentColor" viewbox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <circle cx="50" cy="50" r="50"></circle>
            <circle cx="20" cy="20" fill="var(--color-surface)" r="10"></circle>
          </svg>
        </div>
        <div class="flex flex-col gap-6 relative z-10">
          <div class="flex items-center gap-6">
            <span class="font-display-md text-display-md text-secondary opacity-80 leading-none">01</span>
            <div class="flex flex-col">
              <span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-[0.2em]">Section I</span>
              <span class="font-label-md text-label-md text-on-surface uppercase tracking-widest">Business Reality</span>
            </div>
          </div>
          <h1 class="font-display-md text-display-md text-on-surface max-w-[15ch]">
            How often do you feel like your business depends on you to keep everything moving?
          </h1>
        </div>
        <p class="font-body-lg text-body-lg text-on-surface-variant max-w-md">
          Consider your day-to-day operations. If you stepped away for a month, would the engine keep running, or grind to a halt?
        </p>
      </div>
      <!-- Right Zone: Answers Grid -->
      <div class="w-full lg:w-7/12 flex flex-col gap-12">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-gutter" id="assessment-grid">
          <!-- Option: Never -->
          <button class="assessment-card group flex flex-col items-start justify-between p-8 min-h-[240px] bg-surface-container rounded-xl shadow-md hover:shadow-xl hover:-translate-y-2 transition-all duration-500 ease-out relative overflow-hidden text-left" data-value="never">
            <div class="w-full flex justify-between items-start">
              <span class="card-label font-label-md text-label-md text-on-surface-variant transition-colors duration-300">A</span>
              <span class="material-symbols-outlined card-icon text-on-secondary opacity-0 transform scale-50 transition-all duration-300">check_circle</span>
            </div>
            <span class="card-text font-headline-sm text-headline-sm text-on-surface transition-colors duration-300 mt-auto">Never</span>
          </button>
          <!-- Option: Sometimes -->
          <button class="assessment-card group flex flex-col items-start justify-between p-8 min-h-[240px] bg-surface-container rounded-xl shadow-md hover:shadow-xl hover:-translate-y-2 transition-all duration-500 ease-out relative overflow-hidden text-left" data-value="sometimes">
            <div class="w-full flex justify-between items-start">
              <span class="card-label font-label-md text-label-md text-on-surface-variant transition-colors duration-300">B</span>
              <span class="material-symbols-outlined card-icon text-on-secondary opacity-0 transform scale-50 transition-all duration-300">check_circle</span>
            </div>
            <span class="card-text font-headline-sm text-headline-sm text-on-surface transition-colors duration-300 mt-auto">Sometimes</span>
          </button>
          <!-- Option: Often -->
          <button class="assessment-card group flex flex-col items-start justify-between p-8 min-h-[240px] bg-surface-container rounded-xl shadow-md hover:shadow-xl hover:-translate-y-2 transition-all duration-500 ease-out relative overflow-hidden text-left" data-value="often">
            <div class="w-full flex justify-between items-start">
              <span class="card-label font-label-md text-label-md text-on-surface-variant transition-colors duration-300">C</span>
              <span class="material-symbols-outlined card-icon text-on-secondary opacity-0 transform scale-50 transition-all duration-300">check_circle</span>
            </div>
            <span class="card-text font-headline-sm text-headline-sm text-on-surface transition-colors duration-300 mt-auto">Often</span>
          </button>
          <!-- Option: Always -->
          <button class="assessment-card group flex flex-col items-start justify-between p-8 min-h-[240px] bg-surface-container rounded-xl shadow-md hover:shadow-xl hover:-translate-y-2 transition-all duration-500 ease-out relative overflow-hidden text-left" data-value="always">
            <div class="w-full flex justify-between items-start">
              <span class="card-label font-label-md text-label-md text-on-surface-variant transition-colors duration-300">D</span>
              <span class="material-symbols-outlined card-icon text-on-secondary opacity-0 transform scale-50 transition-all duration-300">check_circle</span>
            </div>
            <span class="card-text font-headline-sm text-headline-sm text-on-surface transition-colors duration-300 mt-auto">Always</span>
          </button>
        </div>
        <!-- Action Area -->
        <div class="flex justify-end pt-8 w-full">
          <button class="bg-surface-variant text-on-surface-variant font-label-md text-label-md px-12 py-6 rounded-full flex items-center gap-4 transition-all duration-500 opacity-40 pointer-events-none shadow-sm" id="action-continue">
            CONTINUE
            <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
          </button>
        </div>
      </div>
    </div>
  </div>
</section>
