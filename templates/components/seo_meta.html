<!-- SEO Meta Tags -->
<meta name="description" content="{% block meta_description %}Work Less. Earn Predictably. Sleep Better. Precision coaching for high-stakes leadership and organizational transformation.{% endblock %}">

<!-- Open Graph / Facebook -->
<meta property="og:type" content="website">
<meta property="og:url" content="{{ request.build_absolute_uri }}">
<meta property="og:title" content="{% block og_title %}Nexora Consulting — International Profit & Mindset Coach{% endblock %}">
<meta property="og:description" content="{% block og_description %}Build a business that creates predictable income without demanding everything from you.{% endblock %}">
<meta property="og:image" content="{% block og_image %}{% endblock %}">

<!-- Twitter -->
<meta property="twitter:card" content="summary_large_image">
<meta property="twitter:url" content="{{ request.build_absolute_uri }}">
<meta property="twitter:title" content="{% block twitter_title %}Nexora Consulting — International Profit & Mindset Coach{% endblock %}">
<meta property="twitter:description" content="{% block twitter_description %}Build a business that creates predictable income without demanding everything from you.{% endblock %}">
<meta property="twitter:image" content="{% block twitter_image %}{% endblock %}">
